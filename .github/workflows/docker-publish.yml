name: Build and deploy web

on:
  # Kører kun når "Next.js CI" er færdig på main
  workflow_run:
    workflows: ["Next.js CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rocwebek/seenit-web-frontend
  # Bages ind i Next.js ved build – bruges af browseren til at kalde API'et
  NEXT_PUBLIC_API_URL: https://api.2-29-189-168.sslip.io

jobs:
  build:
    # Kun hvis CI lykkedes og var udløst af et push (eller ved manuel kørsel)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Hent koden
        uses: actions/checkout@v4
        with:
          # Byg præcis det commit som CI testede
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log ind på GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sæt Docker Buildx op
        uses: docker/setup-buildx-action@v3

      - name: Byg og push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Opdater web på serveren
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/seenit-infra
            docker compose pull web
            docker compose up -d web
            docker image prune -f
